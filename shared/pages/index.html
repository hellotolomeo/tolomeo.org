{% extends 'shared/pages/base.html' %}
{% block head %}
<link rel="stylesheet" href="/components/project-index.css">
<script src="/lib/vendor/nunjucks.min.js" defer></script>
<script src="/lib/vendor/idiomorph.min.js" defer></script>
<script type="module" src="/client/main.js"></script>
{% endblock %}
{% block content %}
<header class="site-head">
<h1 class="visually-hidden">Tolomeo</h1>
{% if site.intro | length %}
<p>{% for line in site.intro %}<span class="l">{{ line | safe }}</span>{% if not loop.last %} {% endif %}{% endfor %}</p>
{% endif %}
</header>
<main>
<project-index projects="{{ projects | dump | e }}" match="{{ match }}"></project-index>
</main>
{% endblock %}
