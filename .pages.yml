# Pages CMS configuration for tolomeo.org (https://app.pagescms.org).
# Field names must match the front matter in content/ and what server/content.js reads.
# Editing guide for Tolomeo: EDITING.md.
#
# To add a tag category: add one line under `tags` -> options -> values below
# (keep the spelling lower case; the site picks it up on the next build).

media:
  input: images
  output: /images
  # Uploads get safe file names (lower case, no spaces: "IMG 0042.JPG" -> "img-0042.jpg").
  # A file with the same name as an existing one is never overwritten: Pages CMS saves it
  # as name-1.jpg, name-2.jpg, ... instead.
  rename: safe
  # The upload picker's list. Image fields below repeat it in their own options.extensions,
  # because a field's own list is what an entry is validated against on save: without heic
  # there, a project holding an iPhone photo could not be saved before CI converts it to .jpg.
  extensions: [jpg, jpeg, png, webp, avif, gif, svg, heic, heif, tif, tiff, JPG, JPEG, PNG, WEBP, HEIC, HEIF, TIF, TIFF]

settings:
  content:
    # Keep any front matter key this file doesn't describe when a file is saved.
    merge: true

content:
  - name: projects
    label: Projects
    description: "Every project on the site, one per file. Guide: https://github.com/hellotolomeo/tolomeo.org/blob/main/EDITING.md"
    type: collection
    path: content/projects
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    operations:
      # The file name comes from the slug; renaming the file alone would only confuse things.
      rename: false
    view:
      primary: title
      fields: [title, years, order, published]
      sort: [order, title, year_start]
      search: [title, slug]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: "The project's name, exactly as it should appear on the site."

      - name: slug
        label: Slug (web address)
        type: string
        required: true
        pattern:
          regex: '^[a-z0-9]+(-[a-z0-9]+)*$'
          message: "Lower case letters and numbers only, words joined by hyphens (for example: the-riso-studio)."
        description: "Used in the web address and as the photo folder name. Lower case, words joined by hyphens. Don't change it after publishing."

      - name: published
        label: Published
        type: boolean
        default: true
        description: "Off = hidden everywhere, including its page."

      - name: order
        label: Order
        type: number
        required: true
        options:
          step: any
          min: 0
        description: "Position in the list. Whole numbers are projects; 2.1, 2.2 … sit under project 2 (use 2.01…2.10 if you need ten or more)."

      - name: parent
        label: Part of (parent project)
        type: reference
        options:
          collection: projects
          value: "{fields.slug}"
          label: "{fields.title}"
          search: "fields.title,fields.slug"
        description: "Only for sub-projects: pick the main project this belongs under, and give it an order like 2.1. Leave empty for a main project."

      - name: years
        label: Years
        type: string
        description: "Shown exactly as typed, e.g. 2023–2026, 2025, 2026 or 2023 –"

      - name: year_start
        label: Start year
        type: number
        options:
          min: 1900
          max: 2100
        description: "Only used for sorting; leave year_end empty if ongoing."

      - name: year_end
        label: End year
        type: number
        options:
          min: 1900
          max: 2100
        description: "Only used for sorting; leave year_end empty if ongoing."

      - name: tags
        label: Tags
        type: select
        options:
          multiple: true
          placeholder: "Choose categories"
          # The closed list of filter categories. Add a new one as one more line, in
          # alphabetical order, lower case. See EDITING.md, "Add a tag category".
          values:
            - art print
            - book
            - booklet
            - boycott
            - collaboration
            - commission
            - department
            - digital designs
            - digital graphic
            - editorial illustration
            - exhibition
            - graphic illustration
            - installation
            - interactive installation
            - logo
            - mentorship
            - performance
            - pop-up exhibition
            - print fundraiser
            - printed banner
            - printed card
            - printed flyer
            - product
            - program
            - public program
            - publication
            - service
            - wallpaper
            - workshop
        description: "Categories people can filter by. To add a new one, ask for it to be added to the list (one line in .pages.yml — see EDITING.md)."

      - name: role
        label: Role
        type: string
        list: true
        description: "What you did, one per line, e.g. illustrator, risoprinter. Shown as 'role:'."

      - name: client
        label: Client
        type: string
        description: "Shown as 'for:'."

      - name: body
        label: Description
        type: rich-text
        options:
          format: markdown
          media: false
        description: "Paragraphs, links, bold and italic (italic shows slanted); other formatting is simplified on the site."

      - name: cover
        label: Thumbnail photo (cover)
        type: image
        options:
          path: images/projects
          extensions: [jpg, jpeg, png, webp, avif, gif, svg, heic, heif, tif, tiff, JPG, JPEG, PNG, WEBP, HEIC, HEIF, TIF, TIFF]
        description: "The photo in the grid on the home page, shown whole in a paper frame. Press Select, open projects, then your project's folder (the first time: Create folder, named like the slug) and upload or drag photos in there. Don't use the Upload button next to Select: it puts photos in images/projects, outside the project's folder. Empty = a blank space in the grid."

      - name: images
        label: Project photos
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{index}. {fields.alt}"
        fields:
          - name: image
            label: Photo
            type: image
            options:
              path: images/projects
              extensions: [jpg, jpeg, png, webp, avif, gif, svg, heic, heif, tif, tiff, JPG, JPEG, PNG, WEBP, HEIC, HEIF, TIF, TIFF]
          - name: alt
            label: Description of the photo
            type: string
            description: "Describe the photo for people who can't see it."
          - name: caption
            label: Caption
            type: string
            description: "Optional. Shown under the photo on the project page. Put *asterisks* around words to slant them, e.g. a *Book Title*."
        description: "The photos on the project page, shown one at a time in this order. Drag to reorder. Press Select and pick or upload photos inside your project's folder (images/projects/<slug>), not with the Upload button next to Select."

      - name: photo_links
        label: Links to more photos
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{fields.label}"
        fields:
          - name: label
            label: Link text
            type: string
            description: "What the link says, e.g. Photos by Jane Doe."
          - name: url
            label: Web address
            type: string
            pattern:
              regex: '^https?://'
              message: "Start with https:// (copy the whole address from the browser)."
        description: "Folders of photos somewhere else (Google Drive, Dropbox, Flickr …), shown as links on the project page."

  - name: index
    label: Home page intro
    description: "The text at the top of the home page. Guide: https://github.com/hellotolomeo/tolomeo.org/blob/main/EDITING.md"
    type: file
    path: content/site/index.md
    format: yaml-frontmatter
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: title
        label: Title
        type: string
        hidden: true
      - name: intro
        label: Intro
        type: text
        description: "The line at the top of the home page. Your name is written [Tolomeo](/info/): that makes it bold and a link to the Info page. Keep the [square] and (round) brackets as they are; change the other words freely."

  - name: info
    label: Info page
    description: "The Info page. Guide: https://github.com/hellotolomeo/tolomeo.org/blob/main/EDITING.md"
    type: file
    path: content/site/info.md
    format: yaml-frontmatter
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: title
        label: Title
        type: string
        readonly: true
        description: "Fixed by the design."
      - name: body
        label: Text
        type: rich-text
        options:
          format: markdown
          media: false
        description: "Paragraphs, links, bold and italic (italic shows slanted); other formatting is simplified on the site."
